<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Explore two interactive Context demos: parallel customer agents and an issue moving from first report to verified recovery.">
  <title>Context · Customer operations</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/context-demo/styles.css">
  <link rel="stylesheet" href="/context-demo/records.css">
  <script src="/context-demo/demo-engine.js" defer></script>
  <script src="/context-demo/app.js" defer></script>
  <script src="/context-demo/autopilot.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#" id="brand" aria-label="Context demo home"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>context<span class="brand-divider"></span><span class="brand-caption">Customer operations</span></a>
    <nav class="scenario-tabs" role="tablist" aria-label="Demo scenario"><button type="button" id="away-tab" role="tab" aria-selected="true" aria-controls="demo-screen" data-scenario="away">Founder overview</button><button type="button" id="lifecycle-tab" role="tab" aria-selected="false" aria-controls="demo-screen" data-scenario="lifecycle">Issue lifecycle</button><button type="button" id="autopilot-tab" role="tab" aria-selected="false" data-href="/context/autopilot">Autopilot flow</button></nav>
    <nav class="records-nav" aria-label="Workspace"><a href="/context/issues">All issues</a><a href="/context/issues/new" class="button-primary">Submit issue</a></nav>
  </header>
  <main class="workspace" id="demo-screen" role="tabpanel" aria-labelledby="away-tab">
    <section class="workspace-heading"><div><p class="eyebrow" id="scenario-number">SCENARIO 01</p><h1 id="scenario-title">While you’re away.</h1><p id="scenario-subtitle">Two cases move forward. You decide what happens next.</p></div><span id="phase-status" class="phase-status">Ready to play</span></section>
    <div class="board-row">
    <section class="board" id="board" aria-label="Interactive workflow diagram"><div class="column-labels" id="columns" aria-hidden="true"></div><svg class="connections" id="connections" aria-hidden="true"></svg><div id="nodes"></div></section>
    <aside class="autopilot" id="autopilot" aria-label="Autopilot: agents handling tickets from connected sources" hidden></aside>
    </div>
    <div class="playback-dock" aria-label="Demo playback"><button type="button" class="reset-button" id="reset" aria-label="Restart this scenario" title="Restart this scenario"></button><div class="dock-divider"></div><div class="step-info"><span class="step-counter" id="step-counter"></span><strong id="step-title"></strong></div><div class="step-progress" id="step-progress" aria-label="Scenario progress"></div><button type="button" class="next-button" id="next">Next</button><button type="button" class="primary-button" id="play"></button></div>
    <div class="workspace-footnote"><span>Sample data · No live calls, refunds or deployments</span><button type="button" id="demo-guide">How to use this demo ↗</button></div>
  </main>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><div><p class="eyebrow" id="detail-ref"></p><h2 id="detail-title"></h2></div><button type="button" class="close-button" id="close" aria-label="Close details"></button></div><div id="detail-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>
</html>
